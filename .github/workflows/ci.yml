name: Test and publish EDM DODGE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: npm run check
      - name: Run gameplay regression tests
        run: npm test
      - name: Capture Chrome menu and gameplay screenshots
        run: node tests/browser-smoke.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Archive visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reli-visual-regression
          path: visual-screenshots/
          if-no-files-found: ignore

  deploy:
    name: Publish browser build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
